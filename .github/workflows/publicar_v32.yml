name: Publicar BAMBAM V32 WEB RAPIDA
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  preparar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraer sitio
        run: |
          mkdir -p sitio
          unzip -q BAMBAM_WEB_V32_RAPIDA.zip -d sitio
          test -s sitio/index.html
          touch sitio/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
  publicar:
    needs: preparar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
